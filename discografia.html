<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore os álbuns e faixas disponíveis para ouvir na NovaSound.">
    <title>Discografia — NovaSound</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>    
    <a href="index.html" class="logo">
        <img src="LOGO.png" alt="Logo NovaSound">
        <span></span>
    </a>
  <nav>
    <a href="index.html">Início</a>
    <a href="artistas.html">Artistas</a>
    <a href="discografia.html" aria-current="page">Discografia</a>
  </nav>    
</header>

    <main>
        <section class="page-header">
            <h1>Discografia</h1>
            <p>Álbuns disponíveis para ouvir.</p>
        </section>

        <label class="visually-hidden" for="searchInput">Buscar álbum ou artista</label>
        <input type="search" id="searchInput" placeholder="Buscar álbum ou artista...">
        <p class="empty-state is-hidden" id="emptyState" role="status">Nenhum álbum encontrado.</p>

            <div class="album-grid" id="albumGrid">
        
    </div>

    
    <!-- Fazendo a segunda página para o álbum que for clicado. -->
    
    <div class="album-detail is-hidden" id="albumDetail">
        <button class="back-btn" id="backBtn">&#8592; Voltar</button>


        <div class="album-detail-header">
            <img id="detailCover" src="" alt="">
            <div class="album-detail-info">
                <h2 id="detailName"></h2>
                <p id="detailArtist"></p>
                <p id="detailYear"></p>
            </div>
        </div>

        <ol class="tracklist" id="detailTracklist">
            <!-- Faixas serão adicionadas pelo JavaScript automaticamente aqui.-->
        </ol>
    </div>

    

    </main>

<div class="player-bar is-hidden" id="playerBar">
    <img id="playerCover" src="" alt="">

    <div class="player-info">
        <p id="playerTrackTitle"></p>
        <p id="playerTrackArtist"></p>
    </div>

    <button class="player-control-btn" id="previousBtn" aria-label="Faixa anterior">
        &#9198;
    </button>

    <button class="play-pause-btn" id="playPauseBtn" type="button" aria-label="Reproduzir">&#9658;</button>

    <button class="player-control-btn" id="nextBtn" aria-label="Próxima faixa">
        &#9197;
    </button>

    <div class="player-progress">
        <span id="currentTime">0:00</span>
        <label class="visually-hidden" for="progressBar">Posição da faixa</label>
        <input type="range" id="progressBar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
    </div>

<label class="visually-hidden" for="volumeBar">Volume</label>
<input
    type="range"
    id="volumeBar"
    min="0"
    max="1"
    step="0.01"
    value="1"
>


</div>

    <script src="player.js"></script>
    <script src="dados.js"></script>
    <script src="discografia.js"></script>
</body>
</html>
